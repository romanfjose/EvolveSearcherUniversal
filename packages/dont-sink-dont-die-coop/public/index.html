<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dream River Racing Survival</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #87CEEB; font-family: sans-serif; }
        #ui { position: absolute; top: 10px; left: 10px; color: white; text-shadow: 1px 1px 2px black; pointer-events: none; }
        #instructions { position: absolute; bottom: 10px; width: 100%; text-align: center; color: white; text-shadow: 1px 1px 2px black; pointer-events: none; }
        #shop { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.7); padding: 10px; color: white; border-radius: 5px; display: none; }
        .shop-item { margin-bottom: 10px; }
        .shop-btn { background: #4CAF50; border: none; color: white; padding: 5px 10px; cursor: pointer; border-radius: 3px; }
        .shop-btn:hover { background: #45a049; }
    </style>
</head>
<body>
    <div id="ui">
        <h2>River Escape</h2>
        <div id="health">Health: 100</div>
        <div id="coins">Coins: 50</div>
    </div>
    
    <div id="shop">
        <h3>City Shop (Press E to close)</h3>
        <div class="shop-item">Motor (Faster speed, harder turning) - 10c <button class="shop-btn" onclick="buyUpgrade('motor')">Buy</button></div>
        <div class="shop-item">Squeaky Hammer (More damage) - 15c <button class="shop-btn" onclick="buyUpgrade('weapon')">Buy</button></div>
        <div class="shop-item">Raft Armor (+50 Max Health) - 20c <button class="shop-btn" onclick="buyUpgrade('armor')">Buy</button></div>
    </div>

    <div id="instructions">
        WASD to steer/paddle | SPACE to jump | CLICK to attack | Approach City and press E to Shop
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
                "cannon-es": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"
            }
        }
    </script>
    <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="js/main.js"></script>
    <script>
        function buyUpgrade(type) {
            window.buyUpgradeEvent(type);
        }
    </script>
</body>
</html>
