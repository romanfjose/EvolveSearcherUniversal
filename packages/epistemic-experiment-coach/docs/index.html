    why: "A concrete example shows whether the gap is ability or just unfamiliarity.",
    falsifier: "If the observed steps look doable for you, “I'm not capable yet” loses support—what's missing is practice, not ability.",
    minimum_success: "Observe one person or example and write down three things you notice.",
    materials: ["A real example", "Notes"],
    steps: ["Find one credible example of the activity being done.", "Watch without trying to master everything.", "Write down three specific actions you observe.", "Circle the easiest action to copy.", "Try only that action once."],
    upgrades: ["Compare a second example.", "Ask someone why they chose that approach."],
    success_signals: ["You noticed concrete behavior", "You identified one copyable action"],
  },
  {
    id: "payoff-check", tests: ["meaning"], title: "Rate the payoff before and after", time: "15 min", difficulty: "Easy",
    why: "If the value is truly low, a small attempt will confirm it; if it's higher, the doubt was a forecast error.",
    falsifier: "If your after-rating of the value is higher than your before-rating, “not enough value” loses support.",
    minimum_success: "Rate the expected value 1–5, do a ten-minute version, then rate the actual value.",
    materials: ["A ten-minute timer", "A note for before and after ratings"],
    steps: ["Write the one payoff you would most like from this activity.", "Rate how valuable you expect ten minutes of it to feel, from 1 to 5.", "Do the smallest real version for ten minutes.", "Rate how valuable it actually felt, from 1 to 5.", "Write one sentence about what the payoff turned out to be."],
    upgrades: ["Repeat and see whether the rating holds.", "Try a version connected to someone you care about."],
    success_signals: ["You compared expected and actual value", "You know whether the doubt holds up"],
  },
];

function genericDomain(problem = "") {
  const subject = String(problem).trim() || "this";
  return {
    id: "generic",
    label: "General",
    keywords: [],
    reflection: `“${subject}” may contain several different obstacles. Picking the closest one gives us enough information to try a small reality test without overanalyzing it.`,
    hypotheses: [
      { id: "unclear", title: "I don't know where to start", explanation: "The first useful action is not obvious yet." },
      { id: "effort", title: "It feels like too much effort", explanation: "The expected cost is larger than the expected payoff." },
      { id: "skill", title: "I don't feel capable yet", explanation: "Uncertainty and fear of doing it badly create resistance." },
      { id: "meaning", title: "I don't see enough value in it", explanation: "The reason to act is not personally compelling." },
    ],
    challenge_intro: "Let's replace speculation with one small, reversible attempt.",
    challenges: genericChallenges,
    faq: [
      [/easier|simple|smaller|fácil|facil/i, "Make the minimum success smaller: one serving, one page, one message. Completing the loop matters more than making it impressive."],
    ],
  };
}

const escapeRegex = (text) => text.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
const matchers = new Map(DOMAINS.map((domain) => [domain.id, new RegExp(`(?:^|[^\\p{L}])(?:${domain.keywords.map(escapeRegex).join("|")})`, "giu")]));

/** Keyword-count scores per domain id. */
function domainScores(problem = "") {
  const text = String(problem);
  return Object.fromEntries(DOMAINS.map((domain) => [domain.id, (text.match(matchers.get(domain.id)) || []).length]));
}

/** Highest-scoring domain id; ties keep DOMAINS order; no match → "generic". */
function detectDomain(problem = "") {
  const scores = domainScores(problem);
  let best = "generic", bestScore = 0;
  for (const domain of DOMAINS) if (scores[domain.id] > bestScore) { best = domain.id; bestScore = scores[domain.id]; }
  return best;
}

function getDomain(id, problem = "") {
  return DOMAINS.find((domain) => domain.id === id) || genericDomain(problem);
}

const summary = ({ id, tests, title, time, difficulty, why, falsifier }) => ({ id, tests, title, time, difficulty, why, falsifier });

/** Three challenges: the one designed for the hypothesis first, the rest easiest-first. */
function challengesFor(domain, hypothesisId) {
  const effort = (c) => DIFFICULTY_ORDER.indexOf(c.difficulty);
  const targeted = domain.challenges.filter((c) => c.tests.includes(hypothesisId));
  const rest = domain.challenges.filter((c) => !c.tests.includes(hypothesisId)).sort((a, b) => effort(a) - effort(b));
  return [...targeted, ...rest].slice(0, 3).map(summary);
}

/** Offline equivalent of the `understand` action. */
function fallbackUnderstanding(problem) {
  const domain = getDomain(detectDomain(problem), problem);
  return { domain: domain.id, reflection: domain.reflection, hypotheses: domain.hypotheses.map((h) => ({ ...h })) };
}

/** Offline equivalent of the `challenges` action. */
function fallbackChallenges(journey = {}) {
  const domain = getDomain(journey.domain || detectDomain(journey.problem), journey.problem);
  return { challenge_intro: domain.challenge_intro, challenges: challengesFor(domain, journey.selectedHypothesis?.id) };
}

/** Offline equivalent of the `plan` action. Known ids resolve across every tree; custom challenges get a safe template. */
function fallbackPlan(challenge = {}) {
  const known = [...DOMAINS.flatMap((d) => d.challenges), ...genericChallenges].find((c) => c.id === challenge.id);
  if (known) return { ...challenge, ...known };
  return {
    ...challenge,
    falsifier: "If the smallest version turns out easy once you begin, the resistance lived mostly in the anticipation.",
    minimum_success: `Try the smallest real version of “${challenge.title}” for ten minutes. Finishing perfectly is not required.`,
    materials: ["Only what is necessary to begin", "A ten-minute timer"],
    steps: ["Name the smallest visible result.", "Remove anything that is not needed for that result.", "Prepare the first item you need.", "Set a timer for ten minutes.", "Begin before trying to feel ready.", "Stop when the timer rings and notice what happened."],
    upgrades: ["Continue for ten more minutes.", "Repeat once with one improvement."],
    success_signals: ["You began", "You learned where the real friction appears"],
  };
}

/** Offline equivalent of the `chat` action. */
function localReply(journey = {}, text = "") {
  if (journey.phase === "complete") return "That sounds worth noticing. What you felt and what surprised you are part of the evidence too—you can carry that into the next attempt without needing to turn it into a perfect lesson.";
  const domain = getDomain(journey.domain || detectDomain(journey.problem), journey.problem);
  const rule = [...domain.faq, ...genericDomain().faq].find(([pattern]) => pattern.test(text));
  if (rule) return rule[1];
  const challenge = journey.challenge;
  return challenge
    ? `For “${challenge.title},” stay with the minimum-success version first. Tell me the exact step that feels unclear and I'll make only that step more concrete.`
    : "Tell me what part feels most uncertain or annoying. We can make that one part smaller before choosing a challenge.";
}

// ── src/core/journey.mjs
// Journey state machine. Every transition is a pure function (journey, ...) → new journey.
// Guards make illegal states unrepresentable: you cannot reach `plan` without a plan,
// or `complete` without an outcome, and a forecast is frozen once its outcome is known.

const PHASES = ["start", "hypotheses", "insight", "challenges", "plan", "debrief", "complete"];

const OUTCOMES = [
  { id: "easier", label: "Done—it was easier than expected", hit: true, lesson: "The activity may be less unpleasant when decisions and difficulty are reduced. The next test can add only one optional upgrade." },
  { id: "annoying", label: "Done—but it was annoying", hit: true, lesson: "You can complete the activity, but some friction remains. The next useful step is identifying whether setup, execution, or cleanup caused it." },
  { id: "stuck", label: "I started and got stuck", hit: false, lesson: "Starting was possible; a specific step became the real constraint. That is useful evidence, and the next challenge should simplify only that step." },
  { id: "not-done", label: "I didn't do it", hit: false, lesson: "The proposed action was still too large, badly timed, or not meaningful enough. The next experiment should be smaller rather than demanding more motivation." },
];

const PREVIOUS = { hypotheses: "start", insight: "hypotheses", challenges: "insight", plan: "challenges", debrief: "plan", complete: "debrief" };

const hasPlan = (j) => Array.isArray(j.challenge?.steps) && j.challenge.steps.length > 0;
const GUARDS = {
  start: () => true,
  hypotheses: (j) => Array.isArray(j.hypotheses) && j.hypotheses.length > 0,
  insight: (j) => Boolean(j.selectedHypothesis),
  challenges: (j) => Boolean(j.selectedHypothesis) && Array.isArray(j.challenges) && j.challenges.length > 0,
  plan: hasPlan,
  debrief: hasPlan,
  complete: (j) => Boolean(j.outcome),
};

function newJourney({ now = Date.now(), id } = {}) {
  return { id: id || `${now}-${Math.random().toString(36).slice(2, 7)}`, phase: "start", problem: "", chat: [], checked: [], prediction: null, createdAt: now, source: "local" };
}

const previousPhase = (phase) => PREVIOUS[phase] || null;

function progressIndex(phase) {
  if (["start", "hypotheses", "insight"].includes(phase)) return 0;
  if (["challenges", "plan"].includes(phase)) return 1;
  return 2;
}

function canEnter(journey, phase) {
  return Boolean(GUARDS[phase]?.(journey));
}

function goTo(journey, phase) {
  if (!PHASES.includes(phase)) throw new TypeError(`Unknown phase: ${phase}`);
  if (!canEnter(journey, phase)) throw new Error(`Cannot enter "${phase}" from "${journey.phase}"`);
  return { ...journey, phase };
}

function goBack(journey) {
  const target = previousPhase(journey.phase);
  return target ? goTo(journey, target) : journey;
}

const setProblem = (journey, problem) => ({ ...journey, problem: String(problem ?? "") });

function applyAnalysis(journey, result, source = "local") {
  if (!Array.isArray(result?.hypotheses) || !result.hypotheses.length) throw new Error("Analysis returned no hypotheses");
  const problem = journey.problem.trim();
  return {
    ...journey, reflection: result.reflection, hypotheses: result.hypotheses, analyzedProblem: problem,
    domain: result.domain || detectDomain(problem), selectedHypothesis: null, challenges: [], challenge: null, source, phase: "hypotheses",
  };
}

function selectHypothesis(journey, hypothesis) {
  if (!hypothesis?.title) throw new Error("A hypothesis needs a title");
  return { ...journey, selectedHypothesis: hypothesis, challenges: [], challenge: null, phase: "insight" };
}

const clearHypothesis = (journey) => ({ ...journey, selectedHypothesis: null, phase: "hypotheses" });

function applyChallenges(journey, result, source = "local") {
  if (!journey.selectedHypothesis) throw new Error("Choose a hypothesis before challenges");
  if (!Array.isArray(result?.challenges) || !result.challenges.length) throw new Error("No challenges were returned");
  return { ...journey, challenge_intro: result.challenge_intro, challenges: result.challenges, challenge: null, source, phase: "challenges" };
}

/** Choosing (or rebuilding) a plan starts a fresh experiment: progress, forecast and outcome reset. */
function selectChallenge(journey, detail, source = "local") {
  if (!detail?.title || !Array.isArray(detail.steps) || !detail.steps.length) throw new Error("A plan needs a title and steps");
  return { ...journey, challenge: detail, checked: [], prediction: null, outcome: null, learning: null, completedAt: null, source, phase: "plan" };
}

function toggleStep(journey, index) {
  if (!Number.isInteger(index) || index < 0 || index >= (journey.challenge?.steps?.length || 0)) return journey;
  const checked = journey.checked || [];
  return { ...journey, checked: checked.includes(index) ? checked.filter((i) => i !== index) : [...checked, index].sort((a, b) => a - b) };
}

/** Pre-registered forecast (0–100 %) that the minimum success will be reached. Frozen once an outcome exists. */
function setPrediction(journey, percent, now = Date.now()) {
  if (journey.outcome) return journey;
  if (percent === null || percent === undefined || percent === "") return { ...journey, prediction: null };
  const value = Number(percent);
  if (!Number.isFinite(value)) throw new TypeError("Confidence must be a number from 0 to 100");
  return { ...journey, prediction: { confidence: Math.round(Math.min(100, Math.max(0, value))), at: now } };
}

const outcomeById = (id) => OUTCOMES.find((outcome) => outcome.id === id);

function learningFor(journey, outcomeId) {
  const outcome = outcomeById(outcomeId);
  if (!outcome) throw new Error(`Unknown outcome: ${outcomeId}`);
  const parts = [outcome.lesson];
  const falsifier = journey.challenge?.falsifier;
  if (falsifier) parts.push(`Hold it against the falsifier you set: ${falsifier}`);
  if (journey.prediction) {
    const p = journey.prediction.confidence / 100;
    const brier = (p - (outcome.hit ? 1 : 0)) ** 2;
    parts.push(`You gave ${journey.prediction.confidence}% to reaching the minimum success and ${outcome.hit ? "reached it" : "didn't"}: this forecast scores a Brier of ${brier.toFixed(2)} (0 is perfect, 0.25 is a coin flip).`);
  }
  return parts.join(" ");
}

function recordOutcome(journey, outcomeId, now = Date.now()) {
  if (!hasPlan(journey)) throw new Error("Choose a plan before recording an outcome");
  const outcome = outcomeById(outcomeId);
  if (!outcome) throw new Error(`Unknown outcome: ${outcomeId}`);
  return { ...journey, outcome: { id: outcome.id, label: outcome.label }, learning: learningFor(journey, outcomeId), completedAt: now, phase: "complete" };
}

// ── src/core/calibration.mjs
// Brier-score calibration ledger. A forecast is the pre-registered probability that an experiment's
// minimum success will be reached; the outcome is 1 if the debrief says it was done, else 0.
//
// Brier score  BS = (1/N) Σ (f − o)²           0 = perfect, 0.25 = always saying 50 %, 1 = maximally wrong.
// Murphy (1973) decomposition, grouping by distinct forecast value so the identity is exact:
//   BS = REL − RES + UNC
//   REL = (1/N) Σ_k n_k (f_k − ō_k)²   calibration error (lower is better)
//   RES = (1/N) Σ_k n_k (ō_k − ō)²     how much your forecasts separate outcomes (higher is better)
//   UNC = ō (1 − ō)                     difficulty of the outcomes themselves
// Brier skill score vs. always forecasting your base rate: BSS = 1 − BS / UNC (undefined when UNC = 0).

function assertEntries(entries) {
  if (!Array.isArray(entries)) throw new TypeError("Entries must be an array");
  for (const e of entries) {
    if (typeof e?.confidence !== "number" || !(e.confidence >= 0 && e.confidence <= 1)) throw new RangeError(`Confidence must be within [0, 1]: ${e?.confidence}`);
    if (e.outcome !== 0 && e.outcome !== 1) throw new RangeError(`Outcome must be 0 or 1: ${e?.outcome}`);
  }
  return entries;
}

const mean = (values) => values.reduce((sum, v) => sum + v, 0) / values.length;

/** Resolved forecasts from completed journeys, oldest first. */
function ledgerFromJourneys(journeys = []) {
  return journeys
    .filter((j) => Number.isFinite(j?.prediction?.confidence) && outcomeById(j.outcome?.id))
    .map((j) => {
      const outcome = outcomeById(j.outcome.id);
      return {
        id: j.id,
        domain: j.domain || "generic",
        problem: j.problem,
        hypothesis: j.selectedHypothesis?.title ?? null,
        experiment: j.challenge?.title ?? null,
        claim: `I will reach the minimum success: ${j.challenge?.minimum_success ?? "—"}`,
        confidence: Math.min(100, Math.max(0, j.prediction.confidence)) / 100,
        outcome: outcome.hit ? 1 : 0,
        outcomeLabel: outcome.label,
        predictedAt: j.prediction.at ?? null,
        resolvedAt: j.completedAt ?? null,
      };
    })
    .sort((a, b) => (a.resolvedAt ?? 0) - (b.resolvedAt ?? 0));
}

function brierScore(entries) {
  assertEntries(entries);
  return entries.length ? mean(entries.map((e) => (e.confidence - e.outcome) ** 2)) : null;
}

function murphyDecomposition(entries) {
  assertEntries(entries);
  const n = entries.length;
  if (!n) return null;
  const baseRate = mean(entries.map((e) => e.outcome));
  const groups = new Map();
  for (const e of entries) {
    const g = groups.get(e.confidence) || { n: 0, hits: 0 };
    g.n += 1; g.hits += e.outcome;
    groups.set(e.confidence, g);
  }
  let reliability = 0, resolution = 0;
  for (const [f, g] of groups) {
    const observed = g.hits / g.n;
    reliability += g.n * (f - observed) ** 2;
    resolution += g.n * (observed - baseRate) ** 2;
  }
  return { reliability: reliability / n, resolution: resolution / n, uncertainty: baseRate * (1 - baseRate), baseRate };
}

/** Reliability-diagram bins of equal width over [0, 1]; the top bin includes 1. */
function calibrationCurve(entries, bins = 5) {
  assertEntries(entries);
  if (!Number.isInteger(bins) || bins < 1) throw new RangeError("bins must be a positive integer");
  const rows = Array.from({ length: bins }, (_, i) => ({ lo: i / bins, hi: (i + 1) / bins, n: 0, sumF: 0, hits: 0 }));
  for (const e of entries) {
    const row = rows[Math.min(bins - 1, Math.floor(e.confidence * bins))];
    row.n += 1; row.sumF += e.confidence; row.hits += e.outcome;
  }
  return rows.map(({ lo, hi, n, sumF, hits }) => ({ lo, hi, n, meanConfidence: n ? sumF / n : null, hitRate: n ? hits / n : null }));
}

/** Brier score over a trailing window, one point per resolved forecast. */
function rollingBrier(entries, window = 5) {
  assertEntries(entries);
  return entries.map((_, i) => brierScore(entries.slice(Math.max(0, i + 1 - window), i + 1)));
}

function summarize(entries) {
  assertEntries(entries);
  const n = entries.length;
  if (!n) return { n: 0, hits: 0, brier: null, reliability: null, resolution: null, uncertainty: null, baseRate: null, skill: null, meanConfidence: null, overconfidence: null };
  const brier = brierScore(entries);
  const parts = murphyDecomposition(entries);
  const meanConfidence = mean(entries.map((e) => e.confidence));
  return {
    n, hits: entries.reduce((sum, e) => sum + e.outcome, 0), brier, ...parts,
    skill: parts.uncertainty > 0 ? 1 - brier / parts.uncertainty : null,
    meanConfidence,
    overconfidence: meanConfidence - parts.baseRate,
  };
}

/** One-line plain-language reading of a summary. */
function interpret(summary) {
  if (!summary.n) return "No resolved forecasts yet. Set a confidence before your next experiment.";
  if (summary.n < 5) return `${summary.n} resolved forecast${summary.n === 1 ? "" : "s"} so far—too few to read a pattern yet.`;
  const gap = Math.round(summary.overconfidence * 100);
  if (Math.abs(gap) <= 10) {
    return summary.reliability <= 0.05
      ? `Your average confidence is within ${Math.abs(gap)} points of your hit rate and individual forecasts track outcomes: well calibrated so far.`
      : `On average your confidence matches your hit rate, but individual forecasts miss in both directions (reliability ${summary.reliability.toFixed(2)}). Save extreme numbers for experiments you have evidence about.`;
  }
  return gap > 0
    ? `You are overconfident by about ${gap} points: you expect to succeed more often than you do. Shrink the next experiment or lower your forecast.`
    : `You are underconfident by about ${-gap} points: you succeed more often than you expect. Your fear is a worse predictor than your track record.`;
}

const fixed = (value, digits = 3) => (value === null || value === undefined ? "—" : value.toFixed(digits));
const pct = (value) => (value === null || value === undefined ? "—" : `${Math.round(value * 100)}%`);
const iso = (ms) => (Number.isFinite(ms) ? new Date(ms).toISOString() : null);
const cell = (text) => String(text ?? "—").replace(/\|/g, "\\|").replace(/\s+/g, " ");

function toJSON(entries, { now = Date.now() } = {}) {
  return JSON.stringify({
    format: "clash-with-reality/calibration-ledger",
    version: 1,
    exportedAt: iso(now),
    summary: summarize(entries),
    curve: calibrationCurve(entries),
    entries: entries.map((e) => ({ ...e, predictedAt: iso(e.predictedAt), resolvedAt: iso(e.resolvedAt) })),
  }, null, 2);
}

function toMarkdown(entries, { now = Date.now() } = {}) {
  const s = summarize(entries);
  const lines = [
    "# Calibration ledger",
    "",
    `Exported ${iso(now)} · ${s.n} resolved forecast${s.n === 1 ? "" : "s"}.`,
    "",
    `> ${interpret(s)}`,
    "",
    "| Metric | Value |",
    "| --- | --- |",
    `| Brier score (0 best, 0.25 = coin flip) | ${fixed(s.brier)} |`,
    `| Reliability (calibration error) | ${fixed(s.reliability)} |`,
    `| Resolution | ${fixed(s.resolution)} |`,
    `| Uncertainty | ${fixed(s.uncertainty)} |`,
    `| Brier skill vs. base rate | ${fixed(s.skill)} |`,
    `| Mean confidence | ${pct(s.meanConfidence)} |`,
    `| Hit rate | ${pct(s.baseRate)} |`,
    "",
    "## Calibration curve",
    "",
    "| Confidence bin | Forecasts | Mean confidence | Hit rate |",
    "| --- | --- | --- | --- |",
    ...calibrationCurve(entries).map((b) => `| ${pct(b.lo)}–${pct(b.hi)} | ${b.n} | ${pct(b.meanConfidence)} | ${pct(b.hitRate)} |`),
    "",
    "## Forecasts",
    "",
    "| # | Resolved | Domain | Experiment | Confidence | Outcome | Brier |",
    "| --- | --- | --- | --- | --- | --- | --- |",
    ...entries.map((e, i) => `| ${i + 1} | ${cell(iso(e.resolvedAt)?.slice(0, 10))} | ${cell(e.domain)} | ${cell(e.experiment)} | ${pct(e.confidence)} | ${e.outcome ? "Hit" : "Miss"} — ${cell(e.outcomeLabel)} | ${fixed((e.confidence - e.outcome) ** 2)} |`),
    "",
  ];
  return lines.join("\n");
}

/** Reliability diagram as a self-contained SVG string (numbers only, no user text). */
function calibrationChart(entries, { bins = 5, size = 240 } = {}) {
  const pad = 46, plot = size - pad - 12;
  const x = (v) => pad + v * plot, y = (v) => 12 + (1 - v) * plot;
  const points = calibrationCurve(entries, bins).filter((b) => b.n);
  const ticks = [0, 0.5, 1].map((t) => `<line x1="${x(t)}" y1="${y(0)}" x2="${x(t)}" y2="${y(1)}" class="cal-grid"/><line x1="${x(0)}" y1="${y(t)}" x2="${x(1)}" y2="${y(t)}" class="cal-grid"/><text x="${x(t)}" y="${y(0) + 14}" text-anchor="middle">${t * 100}%</text><text x="${x(0) - 5}" y="${y(t) + 4}" text-anchor="end">${t * 100}%</text>`).join("");
  const path = points.map((b, i) => `${i ? "L" : "M"}${x(b.meanConfidence).toFixed(1)},${y(b.hitRate).toFixed(1)}`).join(" ");
  const dots = points.map((b) => `<circle cx="${x(b.meanConfidence).toFixed(1)}" cy="${y(b.hitRate).toFixed(1)}" r="${(4 + 2 * Math.sqrt(b.n)).toFixed(1)}" class="cal-dot"><title>${Math.round(b.lo * 100)}–${Math.round(b.hi * 100)}% bin: ${b.n} forecast${b.n === 1 ? "" : "s"}, mean confidence ${Math.round(b.meanConfidence * 100)}%, hit rate ${Math.round(b.hitRate * 100)}%</title></circle>`).join("");
  return `<svg class="cal-chart" viewBox="0 0 ${size} ${size}" role="img" aria-label="Reliability diagram: confidence on the horizontal axis, observed hit rate on the vertical axis; points on the diagonal are perfectly calibrated.">${ticks}<line x1="${x(0)}" y1="${y(0)}" x2="${x(1)}" y2="${y(1)}" class="cal-ideal"/>${points.length > 1 ? `<path d="${path}" class="cal-line"/>` : ""}${dots}<text x="${x(0.5)}" y="${size - 2}" text-anchor="middle" class="cal-axis">Confidence</text><text x="12" y="${y(0.5)}" text-anchor="middle" class="cal-axis" transform="rotate(-90 12 ${y(0.5)})">Hit rate</text></svg>`;
}

// ── src/standalone/app.js
// Zero-dependency UI for the standalone build (docs/index.html). Runs only the deterministic coach.
// scripts/build-standalone.mjs inlines this file and src/core/*.mjs into one HTML page.

const STORE_KEY = "epistemic-coach-v1";
const root = document.getElementById("root");

const esc = (value) => String(value ?? "").replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[ch]);
/** Escapes text, then renders `inline code` spans. */
const rich = (value) => esc(value).replace(/`([^`]+)`/g, "<code>$1</code>");
const percent = (value) => (value === null ? "—" : `${Math.round(value * 100)}%`);

function load() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORE_KEY) || "{}");
    return { journey: saved.current?.phase ? saved.current : newJourney(), history: Array.isArray(saved.history) ? saved.history : [] };
  } catch { return { journey: newJourney(), history: [] }; }
}

let { journey, history } = load();

function save() {
  if (journey.phase === "complete") {
    const index = history.findIndex((item) => item.id === journey.id);
    history = index < 0 ? [...history, journey] : history.map((item, i) => (i === index ? journey : item));
  }
  try { localStorage.setItem(STORE_KEY, JSON.stringify({ current: journey, history })); } catch { /* private mode: keep in memory */ }
}

function commit(transition, { focus } = {}) {
  journey = transition(journey);
  save();
  render();
  if (focus) root.querySelector(focus)?.focus();
  else window.scrollTo({ top: 0 });
}

function download(name, text, type) {
  const url = URL.createObjectURL(new Blob([text], { type }));
  const link = Object.assign(document.createElement("a"), { href: url, download: name });
  document.body.append(link); link.click(); link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 0);
}

const chat = () => {
  const done = journey.phase === "complete";
  const messages = journey.chat || [];
  return `<section class="ee-chat">
    <h3>${done ? "What did you notice?" : "Ask while you go"}</h3>
    <p>${done ? "Share anything that came up—a surprise, a feeling, a small win, or something that still felt off." : "No question is too small—tools, timing, substitutions, or getting unstuck."}</p>
    ${messages.length ? `<div class="ee-messages">${messages.map((m) => `<div class="ee-message ${m.role === "user" ? "user" : ""}">${rich(m.content)}</div>`).join("")}</div>` : ""}
    <form class="ee-chat-row" data-form="chat">
      <input class="ee-input" name="message" maxlength="2000" autocomplete="off" placeholder="${done ? "I noticed…" : "What exactly should I do first?"}" aria-label="${done ? "Share what you noticed" : "Ask the coach"}">
      <button class="ee-btn ai">${done ? "Share" : "Ask"}</button>
    </form>
  </section>`;
};

function calibrationPanel() {
  const entries = ledgerFromJourneys(history);
  const s = summarize(entries);
  return `<section class="ee-calibration" aria-labelledby="cal-title">
    <h2 id="cal-title">Calibration ledger</h2>
    <p class="ee-copy">${esc(interpret(s))}</p>
    ${s.n ? `<div class="ee-cal-grid">
      <div>${calibrationChart(entries)}</div>
      <div>
        <dl class="ee-stats">
          <div><dt>Brier score</dt><dd>${s.brier.toFixed(3)}</dd></div>
          <div><dt>Forecasts</dt><dd>${s.n}</dd></div>
          <div><dt>Mean confidence</dt><dd>${percent(s.meanConfidence)}</dd></div>
          <div><dt>Hit rate</dt><dd>${percent(s.baseRate)}</dd></div>
        </dl>
        <div class="ee-actions">
          <button class="ee-btn ghost small" data-act="export-json">Export JSON</button>
          <button class="ee-btn ghost small" data-act="export-md">Export Markdown</button>
        </div>
      </div>
    </div>` : ""}
  </section>`;
}

const views = {
  start: () => `<section class="ee-card">
      <p class="ee-eyebrow">Start with the honest version</p>
      <h1 class="ee-title">What do you want to get better at—or stop avoiding?</h1>
      <p class="ee-copy">No framework to fill in. Say it normally: “I hate cooking,” “I keep avoiding exercise,” or “I want to speak up at work.”</p>
      <textarea class="ee-textarea" data-input="problem" maxlength="3000" aria-label="Describe what you want to improve" placeholder="I hate cooking because it feels like too much work…">${esc(journey.problem)}</textarea>
      <div class="ee-examples" aria-label="Examples">${DOMAINS.map((d) => `<button type="button" class="ee-example" data-act="example" data-id="${d.id}">${esc(d.label)}</button>`).join("")}</div>
      <div class="ee-actions end"><button class="ee-btn ai" data-act="begin">Help me understand it →</button></div>
    </section>
    ${history.length ? `<section class="ee-history"><h2>Previous reality checks</h2>${history.slice().reverse().map((item) => `<div class="ee-history-item">
        <button data-act="open" data-id="${esc(item.id)}"><strong>${esc(item.problem)}</strong><br><small>${esc(item.challenge?.title || "Exploration")}${item.prediction ? ` · forecast ${item.prediction.confidence}%` : ""}</small></button>
        <div class="ee-history-actions"><small>${new Date(item.createdAt).toLocaleDateString()}</small><button class="ee-delete-btn" data-act="delete" data-id="${esc(item.id)}" aria-label="Delete journey" title="Delete journey">✕</button></div>
      </div>`).join("")}</section>${calibrationPanel()}` : ""}`,

  hypotheses: () => `<section class="ee-card ai">
      <p class="ee-eyebrow">A few possible angles</p>
      ${journey.domain && journey.domain !== "generic" ? `<span class="ee-domain">${esc(getDomain(journey.domain).label)}</span>` : ""}
      <h2 class="ee-h2">What sounds most like you?</h2>
      <p class="ee-copy">These are hypotheses, not judgments. Choose the closest one, or explain it in your own words below.</p>
      <div class="ee-reflection">${esc(journey.reflection)}</div>
      <div class="ee-grid">
        ${journey.hypotheses.map((h, i) => `<button class="ee-choice" data-act="hypothesis" data-index="${i}"><strong>${esc(h.title)}</strong><span>${esc(h.explanation)}</span></button>`).join("")}
        <button class="ee-choice" data-act="hypothesis-all"><strong>All of the above</strong><span>More than one of these frictions is contributing.</span></button>
      </div>
      <form class="ee-custom" data-form="custom-hypothesis"><strong>Something else?</strong>
        <div class="ee-custom-row"><input class="ee-input" name="text" maxlength="300" placeholder="Write your own reason…" aria-label="Your own reason"><button class="ee-btn ai">Use this</button></div>
      </form>
      ${chat()}
    </section>`,

  insight: () => `<section class="ee-card ai">
      <p class="ee-eyebrow">Working hypothesis</p>
      <h2 class="ee-h2">${esc(journey.selectedHypothesis.title)}</h2>
      <div class="ee-reflection"><strong>What this could mean: </strong>${esc(journey.selectedHypothesis.explanation)}</div>
      <p class="ee-copy">We do not need to decide whether this is permanently true. A tiny real-world test will give us better evidence.</p>
      <div class="ee-actions">
        <button class="ee-btn reality" data-act="get-challenges">Give me a reality challenge</button>
        <button class="ee-btn ghost" data-act="clear-hypothesis">Choose another angle</button>
      </div>
    </section>${chat()}`,

  challenges: () => `<section class="ee-card reality">
      <p class="ee-eyebrow reality">Reality challenge #1</p>
      <h2 class="ee-h2">Choose the version you would actually do</h2>
      <p class="ee-copy">${esc(journey.challenge_intro || "The easiest option is valid. You can increase the difficulty after you begin.")}</p>
      <div class="ee-grid">${journey.challenges.map((c, i) => `<button class="ee-choice ee-challenge" data-act="challenge" data-index="${i}">
          <strong>${esc(c.title)}</strong>
          <div class="ee-meta"><span class="ee-pill">${esc(c.time)}</span><span class="ee-pill">${esc(c.difficulty)}</span></div>
          <span>${rich(c.why)}</span>
          ${c.falsifier ? `<span class="ee-falsifier-line">Could prove it wrong: ${rich(c.falsifier)}</span>` : ""}
        </button>`).join("")}</div>
      <form class="ee-custom" data-form="custom-challenge"><strong>Already have a better challenge in mind?</strong>
        <div class="ee-custom-row"><input class="ee-input" name="text" maxlength="300" placeholder="Describe your own small test…" aria-label="Your own challenge"><button class="ee-btn reality">Build my plan</button></div>
      </form>
      <div class="ee-actions"><button class="ee-btn ghost" data-act="goto" data-phase="insight">Not yet—talk more</button></div>
    </section>${chat()}`,

  plan: () => {
    const c = journey.challenge;
    const value = journey.prediction?.confidence;
    const checked = journey.checked || [];
    return `<section class="ee-card reality">
      <p class="ee-eyebrow reality">Your tiny experiment</p>
      <h2 class="ee-h2">${esc(c.title)}</h2>
      <div class="ee-meta"><span class="ee-pill">${esc(c.time)}</span><span class="ee-pill">${esc(c.difficulty)}</span></div>
      <div class="ee-success"><b>Minimum success:</b> ${rich(c.minimum_success)}</div>
      ${c.falsifier ? `<div class="ee-falsifier"><b>What would prove the hypothesis wrong:</b> ${rich(c.falsifier)}</div>` : ""}
      ${c.caution ? `<div class="ee-caution">${esc(c.caution)}</div>` : ""}
      <div class="ee-forecast">
        <label for="forecast">Before you start: how likely are you to reach the minimum success?</label>
        <p>Your honest guess, recorded now, is scored against what happens. It builds your calibration ledger.</p>
        <div class="ee-forecast-row">
          <input id="forecast" type="range" min="0" max="100" step="5" value="${value ?? 50}" data-input="forecast" aria-valuetext="${value === undefined ? "Not set" : `${value}%`}">
          <output for="forecast" id="forecast-value">${value === undefined ? "—" : `${value}%`}</output>
        </div>
      </div>
      <details><summary>What you need</summary><ul class="ee-upgrades">${c.materials.map((x) => `<li>${rich(x)}</li>`).join("")}</ul></details>
      <h3>Do this</h3>
      <div>${c.steps.map((step, i) => `<label class="ee-check"><input type="checkbox" data-input="step" data-index="${i}" ${checked.includes(i) ? "checked" : ""}><span>${rich(step)}</span></label>`).join("")}</div>
      <details><summary>Too easy? Optional upgrades</summary><ul class="ee-upgrades">${c.upgrades.map((x) => `<li>${rich(x)}</li>`).join("")}</ul></details>
      <div class="ee-actions">
        <button class="ee-btn green" data-act="goto" data-phase="debrief">I tried it →</button>
        <button class="ee-btn ghost" data-act="goto" data-phase="challenges">Choose an easier option</button>
      </div>
    </section>${chat()}`;
  },

  debrief: () => `<section class="ee-card learn">
      <p class="ee-eyebrow learn">One-question debrief</p>
      <h2 class="ee-h2">How did it go?</h2>
      <p class="ee-copy">No essay and no guilt. What happened is information for the next attempt.</p>
      <div class="ee-grid">${OUTCOMES.map((o) => `<button class="ee-choice" data-act="outcome" data-id="${o.id}"><strong>${esc(o.label)}</strong></button>`).join("")}</div>
      ${chat()}
    </section>`,

  complete: () => `<section class="ee-card learn">
      <p class="ee-eyebrow learn">Reality updated the model</p>
      <h2 class="ee-h2">That counts as progress.</h2>
      <p><strong>What you tested:</strong> ${esc(journey.selectedHypothesis?.title)}</p>
      <p><strong>What happened:</strong> ${esc(journey.outcome?.label)}</p>
      <div class="ee-reflection"><strong>What the evidence suggests: </strong>${esc(journey.learning)}</div>
      <p class="ee-copy">Saved in this browser${journey.prediction ? ", and your forecast is scored in the calibration ledger on the start screen" : ""}.</p>
      <div class="ee-actions"><button class="ee-btn green" data-act="restart">Start another small improvement</button></div>
    </section>${chat()}`,
};

function render() {
  const phase = journey.phase;
  const current = progressIndex(phase);
  root.innerHTML = `<main class="ee-shell">
    <header class="ee-header">
      <button class="ee-brand" data-act="restart"><strong>Clash with Reality</strong><span>Small actions. Better models.</span></button>
    </header>
    ${phase !== "start" ? `<div class="ee-progress" aria-label="Journey progress">
      <div class="${current === 0 ? "active" : "done"}">1 · Understand</div>
      <div class="reality ${current === 1 ? "active" : current > 1 ? "done" : ""}">2 · Try</div>
      <div class="learn ${current === 2 ? "active" : ""}">3 · Reflect</div>
    </div>` : ""}
    ${previousPhase(phase) ? `<button class="ee-back-step" data-act="back">← Back one step</button>` : ""}
    ${views[phase]()}
    <p class="ee-local">Runs entirely in your browser · built-in coach · saved privately in this browser</p>
  </main>`;
}

const actions = {
  example: (el) => commit((j) => setProblem(j, getDomain(el.dataset.id).example), { focus: "[data-act=begin]" }),
  begin: () => {
    const problem = journey.problem.trim();
    if (!problem) return root.querySelector("[data-input=problem]")?.focus();
    commit((j) => (j.analyzedProblem === problem && j.hypotheses?.length ? goTo(j, "hypotheses") : applyAnalysis(j, fallbackUnderstanding(problem))));
  },
  open: (el) => { const item = history.find((h) => h.id === el.dataset.id); if (item) commit(() => item); },
  delete: (el) => {
    if (!confirm("Delete this journey?")) return;
    const id = el.dataset.id;
    history = history.filter((h) => h.id !== id);
    commit((j) => (j.id === id ? newJourney() : j), { focus: "[data-input=problem]" });
  },
  hypothesis: (el) => commit((j) => selectHypothesis(j, j.hypotheses[Number(el.dataset.index)])),
  "hypothesis-all": () => commit((j) => selectHypothesis(j, { id: "all", title: "All of these contribute", explanation: `Several frictions seem active together: ${j.hypotheses.map((h) => h.title.toLowerCase()).join(", ")}. The challenge should reduce more than one source of friction.` })),
  "clear-hypothesis": () => commit(clearHypothesis),
  "get-challenges": () => commit((j) => (j.challenges?.length ? goTo(j, "challenges") : applyChallenges(j, fallbackChallenges(j)))),
  challenge: (el) => commit((j) => selectChallenge(j, fallbackPlan(j.challenges[Number(el.dataset.index)]))),
  goto: (el) => commit((j) => goTo(j, el.dataset.phase)),
  outcome: (el) => commit((j) => recordOutcome(j, el.dataset.id)),
  back: () => commit(goBack),
  restart: () => commit(() => newJourney()),
  "export-json": () => download(`calibration-${new Date().toISOString().slice(0, 10)}.json`, toJSON(ledgerFromJourneys(history)), "application/json"),
  "export-md": () => download(`calibration-${new Date().toISOString().slice(0, 10)}.md`, toMarkdown(ledgerFromJourneys(history)), "text/markdown"),
};

const forms = {
  chat: (text) => {
    commit((j) => ({ ...j, chat: [...(j.chat || []), { role: "user", content: text }] }));
    commit((j) => ({ ...j, chat: [...j.chat, { role: "assistant", content: localReply(j, text) }] }), { focus: "[data-form=chat] input" });
    const list = root.querySelector(".ee-messages");
    if (list) list.scrollTop = list.scrollHeight;
  },
  "custom-hypothesis": (text) => commit((j) => selectHypothesis(j, { id: "custom", title: text, explanation: `Your own explanation: “${text}”. Treat it as the working hypothesis.` })),
  "custom-challenge": (text) => commit((j) => selectChallenge(j, fallbackPlan({ id: `custom-${Date.now()}`, title: text, time: "You decide", difficulty: "Custom", why: "A challenge chosen by you." }))),
};

function setForecast(input) {
  journey = setPrediction(journey, input.value);
  save();
  const value = journey.prediction?.confidence;
  root.querySelector("#forecast-value").textContent = value === undefined ? "—" : `${value}%`;
  input.setAttribute("aria-valuetext", value === undefined ? "Not set" : `${value}%`);
}

root.addEventListener("click", (event) => {
  const el = event.target.closest("[data-act]");
  if (el) actions[el.dataset.act]?.(el);
  else if (event.target.matches("[data-input=forecast]")) setForecast(event.target);
});

root.addEventListener("submit", (event) => {
  event.preventDefault();
  const text = new FormData(event.target).get("message") ?? new FormData(event.target).get("text");
  if (String(text || "").trim()) forms[event.target.dataset.form]?.(String(text).trim());
});

root.addEventListener("input", (event) => {
  const kind = event.target.dataset.input;
  if (kind === "problem") { journey = setProblem(journey, event.target.value); save(); }
  if (kind === "forecast") setForecast(event.target);
});

root.addEventListener("change", (event) => {
  if (event.target.dataset.input === "step") { journey = toggleStep(journey, Number(event.target.dataset.index)); save(); }
});

render();

})();
</script>
</body>
</html>
