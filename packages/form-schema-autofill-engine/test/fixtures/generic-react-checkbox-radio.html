<!doctype html>
<html lang="en" data-expect-platform="generic">
<head><meta charset="utf-8"><meta name="fixture-url" content="https://careers.example.org/apply/react"><title>React checkbox radio select</title></head>
<body>
<div id="root">
  <form>
    <fieldset>
      <legend>Do you require visa sponsorship?</legend>
      <label><input type="radio" name="sponsor" value="yes" data-framework="react" data-expect="sponsorship">Yes</label>
      <label><input type="radio" name="sponsor" value="no" data-framework="react" data-expect-checked="true" data-expect-state="true">No</label>
    </fieldset>
    <label for="src">How did you hear about us?</label>
    <select id="src" data-framework="react" data-expect="source" data-expect-state="linkedin"><option value="">Choose…</option><option value="jobboard">Job board</option><option value="linkedin">LinkedIn</option><option value="friend">A friend</option></select>
    <div><input type="checkbox" id="reloc" data-framework="react" data-expect="relocation" data-expect-state="true"><label for="reloc">I'm willing to relocate</label></div>
    <button type="submit" data-expect="redline">Apply</button>
  </form>
</div>
</body></html>
