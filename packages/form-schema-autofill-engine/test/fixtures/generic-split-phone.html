<!doctype html>
<html lang="en" data-expect-platform="generic">
<head><meta charset="utf-8"><meta name="fixture-url" content="https://careers.example.org/apply/phone"><title>Split phone</title></head>
<body>
<form>
  <fieldset class="phone">
    <legend>Phone</legend>
    <select name="phone_cc" aria-label="Country code" data-expect="phone_country_code" data-expect-value="+44">
      <option value="+1">United States (+1)</option><option value="+1">Canada (+1)</option><option value="+44">United Kingdom (+44)</option><option value="+353">Ireland (+353)</option>
    </select>
    <input type="tel" name="phone_number" aria-label="Phone number" data-expect="phone" data-expect-value="7700 900123">
    <input type="text" name="phone_ext" aria-label="Extension" data-expect="-">
  </fieldset>
  <button type="submit" data-expect="redline">Apply</button>
</form>
</body></html>
