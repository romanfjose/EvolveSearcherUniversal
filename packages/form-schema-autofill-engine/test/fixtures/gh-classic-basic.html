<!doctype html>
<html lang="en" data-expect-platform="greenhouse">
<head><meta charset="utf-8"><meta name="fixture-url" content="https://boards.greenhouse.io/acme/jobs/4012345"><title>Job Application for Staff Engineer at Acme</title></head>
<body>
<div id="application">
  <form id="application_form" action="/acme/jobs/4012345" method="post" enctype="multipart/form-data" accept-charset="UTF-8">
    <h2>Submit Your Application</h2>
    <div class="field">
      <label for="first_name">First Name <span class="asterisk">*</span></label>
      <input type="text" id="first_name" name="job_application[first_name]" aria-required="true" data-expect="first_name" data-expect-value="Ada">
    </div>
    <div class="field">
      <label for="last_name">Last Name <span class="asterisk">*</span></label>
      <input type="text" id="last_name" name="job_application[last_name]" aria-required="true" data-expect="last_name" data-expect-value="Lovelace">
    </div>
    <div class="field">
      <label for="email">Email <span class="asterisk">*</span></label>
      <input type="text" id="email" name="job_application[email]" data-expect="email" data-expect-value="ada.lovelace@example.com">
    </div>
    <div class="field">
      <label for="phone">Phone</label>
      <input type="text" id="phone" name="job_application[phone]" data-expect="phone" data-expect-value="7700 900123">
    </div>
    <div class="field" id="resume_fieldset">
      <label>Resume/CV <span class="asterisk">*</span></label>
      <div class="drop-zone">
        <span class="drop-label">Attach, Dropbox, Google Drive, or enter manually</span>
        <button type="button" class="link-button" data-source="attach">Attach</button>
        <button type="button" class="link-button" data-source="paste">enter manually</button>
        <input type="file" id="resume" name="job_application[resume]" style="display:none" data-expect="resume">
      </div>
    </div>
    <div class="field" id="cover_letter_fieldset">
      <label>Cover Letter</label>
      <div class="drop-zone">
        <button type="button" class="link-button">Attach</button>
        <input type="file" id="cover_letter" name="job_application[cover_letter]" style="display:none" data-expect="cover_letter">
      </div>
    </div>
    <div class="field">
      <label for="job_application_answers_attributes_0_text_value">LinkedIn Profile</label>
      <input type="hidden" name="job_application[answers_attributes][0][question_id]" value="41234567">
      <input type="text" id="job_application_answers_attributes_0_text_value" name="job_application[answers_attributes][0][text_value]" data-expect="linkedin" data-expect-value="https://www.linkedin.com/in/ada-example">
    </div>
    <div class="field">
      <label for="job_application_answers_attributes_1_text_value">Website</label>
      <input type="hidden" name="job_application[answers_attributes][1][question_id]" value="41234568">
      <input type="text" id="job_application_answers_attributes_1_text_value" name="job_application[answers_attributes][1][text_value]" data-expect="website" data-expect-value="https://ada.example.com">
    </div>
    <div id="submit_buttons">
      <input type="button" id="submit_app" value="Submit Application" data-expect="redline">
    </div>
  </form>
</div>
</body>
</html>
