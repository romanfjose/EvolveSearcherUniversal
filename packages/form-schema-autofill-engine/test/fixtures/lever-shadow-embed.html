<!doctype html>
<html lang="en" data-expect-platform="lever">
<head><meta charset="utf-8"><meta name="fixture-url" content="https://careers.acme.example/jobs/staff-engineer"><title>Careers - Staff Engineer</title></head>
<body>
<header><nav><a href="/">Acme</a> <button type="button" class="nav-toggle">Menu</button></nav></header>
<acme-apply-widget data-posting="2b6f1c4e">
  <template shadowrootmode="open">
    <style>:host{display:block}</style>
    <form class="application-form" method="POST">
      <ul>
        <li class="application-question"><label><div class="application-label">Full name✱</div><div class="application-field"><input type="text" name="name" data-expect="full_name" data-expect-value="Ada Lovelace"></div></label></li>
        <li class="application-question"><label><div class="application-label">Email✱</div><div class="application-field"><input type="email" name="email" data-expect="email" data-expect-value="ada.lovelace@example.com"></div></label></li>
        <li class="application-question"><label><div class="application-label">LinkedIn URL</div><div class="application-field"><input type="text" name="urls[LinkedIn]" data-expect="linkedin"></div></label></li>
        <li class="application-question resume"><label><div class="application-label">Resume/CV✱</div><div class="application-field"><input type="file" name="resume" data-expect="resume"></div></label></li>
      </ul>
      <button type="submit" class="template-btn-submit" data-expect="redline">Submit application</button>
    </form>
  </template>
</acme-apply-widget>
</body>
</html>
